<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete seu cadastro | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://unpkg.com/lucide@1.29.0/dist/umd/lucide.min.js" integrity="sha384-wyD7qHuL36bnPiQFkqRuq46WXCrlyGbI5w/mvqgTcJ/NwMFSXCr1f+DpJoCqeLRY" crossorigin="anonymous"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>
    <script src="./js/sorteio-api.js" defer></script>
</head>

<body class="bg-brand-dark text-brand-light dark:text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div class="pb-6" id="header-placeholder"></div>

            <main class="pb-20 px-4 sm:px-6">
                <div class="max-w-7xl mx-auto">
                    <div class="max-w-md mx-auto bg-brand-dark border border-white/10 rounded-2xl p-6 sm:p-8">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl font-bold mb-2">Complete seu cadastro</h1>
                            <p class="text-sm text-gray-400">
                                Para participar do sorteio precisamos dos seus dados e do seu consentimento.
                            </p>
                        </div>

                        <div id="form-mensagem" class="msg-topo hidden"></div>

                        <form id="form-completar" class="space-y-6" novalidate>
                            <div>
                                <label for="nome" class="block text-sm mb-1.5 text-gray-300">Nome completo *</label>
                                <input id="nome" name="nome" type="text" required placeholder="João da Silva"
                                    class="input-tech">
                            </div>
                            <div>
                                <label for="cpf" class="block text-sm mb-1.5 text-gray-300">CPF *</label>
                                <input id="cpf" name="cpf" type="text" required placeholder="000.000.000-00" maxlength="14"
                                    class="input-tech">
                            </div>
                            <div>
                                <label for="celular" class="block text-sm mb-1.5 text-gray-300">Celular (com DDD) *</label>
                                <input id="celular" name="celular" type="tel" required value="(" placeholder="(41) 99999-8888"
                                    class="input-tech">
                            </div>
                            <div>
                                <label for="empresa" class="block text-sm mb-1.5 text-gray-300">Empresa (opcional)</label>
                                <input id="empresa" name="empresa" type="text"
                                    class="input-tech">
                            </div>

                            <label class="flex items-start gap-3 text-sm text-gray-300 cursor-pointer bg-white/[0.03] border border-white/10 rounded-lg p-3">
                                <input id="consentimento" type="checkbox" required class="mt-1 accent-green-500">
                                <span class="leading-relaxed">
                                    Li e aceito a
                                    <a href="./privacidade.html" target="_blank" rel="noopener"
                                        class="underline hover:text-white transition">Política de Privacidade</a>,
                                    incluindo o tratamento dos meus dados pessoais para a realização do sorteio,
                                    conforme a Lei Geral de Proteção de Dados (LGPD).
                                </span>
                            </label>

                            <button type="submit" id="btn-completar"
                                class="btn-tech btn-tech-primary btn-tech-full">
                                Concluir cadastro
                            </button>
                        </form>
                    </div>
                </div>
            </main>

            <footer id="footer-placeholder" class="footer-tech"></footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = SorteioAPI.getParticipante();
            if (!token) {
                window.location.href = './index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const msgParam = urlParams.get('msg');
            if (msgParam) {
                const formMsg = document.getElementById('form-mensagem');
                formMsg.textContent = msgParam;
                formMsg.classList.remove('hidden');
            }

            const form = document.getElementById('form-completar');
            const msg = document.getElementById('form-mensagem');
            const btn = document.getElementById('btn-completar');
            const cpfInput = document.getElementById('cpf');
            const celularInput = document.getElementById('celular');

            // Máscara CPF: 000.000.000-00
            cpfInput.addEventListener('input', (e) => {
                let val = e.target.value.replace(/\D/g, '').slice(0, 11);
                if (val.length > 9) val = val.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
                else if (val.length > 6) val = val.replace(/(\d{3})(\d{3})(\d{3})/, '$1.$2.$3');
                else if (val.length > 3) val = val.replace(/(\d{3})(\d{3})/, '$1.$2');
                e.target.value = val;
            });

            // Máscara celular: (DD) 99999-9999 ou (DD) 9999-9999
            function formatarCelular(digits) {
                if (digits.length <= 2) return '(' + digits;
                if (digits.length <= 7) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
                return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
            }
            celularInput.addEventListener('input', (e) => {
                let val = e.target.value.replace(/\D/g, '');
                e.target.value = formatarCelular(val);
            });

            // Validação CPF (dígitos verificadores)
            function validarCPF(cpf) {
                cpf = cpf.replace(/\D/g, '');
                if (cpf.length !== 11) return false;
                if (/^(\d)\1{10}$/.test(cpf)) return false;
                for (let t = 9; t < 11; t++) {
                    let soma = 0;
                    for (let i = 0; i < t; i++) {
                        soma += parseInt(cpf[i]) * ((t + 1) - i);
                    }
                    let digito = (soma * 10) % 11;
                    if (digito === 10) digito = 0;
                    if (parseInt(cpf[t]) !== digito) return false;
                }
                return true;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msg.classList.add('hidden');

                function mostrarPopup(texto, campo) {
                    const existing = document.querySelector('.campo-tooltip');
                    if (existing) existing.remove();

                    const tooltip = document.createElement('div');
                    tooltip.className = 'campo-tooltip';
                    tooltip.textContent = texto;

                    const container = campo.parentElement;
                    container.style.position = 'relative';
                    container.appendChild(tooltip);

                    function dismiss() {
                        tooltip.remove();
                        campo.removeEventListener('focus', dismiss);
                        campo.removeEventListener('input', dismiss);
                    }

                    campo.focus();

                    setTimeout(() => {
                        campo.addEventListener('focus', dismiss);
                        campo.addEventListener('input', dismiss);
                    }, 0);
                }

                const nomeInput = document.getElementById('nome');
                if (!nomeInput.value.trim()) {
                    mostrarPopup('Preencha o campo Nome completo.', nomeInput);
                    return;
                }

                const cpfVal = cpfInput.value.replace(/\D/g, '');
                if (!cpfInput.value.trim()) {
                    mostrarPopup('Preencha o campo CPF.', cpfInput);
                    return;
                }
                if (!validarCPF(cpfVal)) {
                    mostrarPopup('CPF inválido. Verifique os dígitos.', cpfInput);
                    return;
                }

                const celularVal = celularInput.value.replace(/\D/g, '');
                if (!celularInput.value.trim()) {
                    mostrarPopup('Preencha o campo Celular.', celularInput);
                    return;
                }
                if (celularVal.length < 10 || celularVal.length > 11) {
                    mostrarPopup('Informe um celular válido com DDD (8 ou 9 dígitos + DDD).', celularInput);
                    return;
                }

                const consentimento = document.getElementById('consentimento');
                if (!consentimento.checked) {
                    mostrarPopup('É necessário aceitar a Política de Privacidade.', consentimento);
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Concluindo...';

                try {
                    await SorteioAPI.atualizarParticipante(token, {
                        nome: nomeInput.value.trim(),
                        cpf: cpfVal,
                        celular: celularVal,
                        empresa: document.getElementById('empresa').value.trim(),
                        consentimento: true,
                    });
                    window.location.href = './jogos.html';
                } catch (err) {
                    msg.textContent = err.message;
                    msg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Concluir cadastro';
                }
            });
        });
    </script>
</body>

</html>

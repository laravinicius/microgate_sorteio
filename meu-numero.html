<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu número da sorte | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>
    <script src="./js/sorteio-api.js" defer></script>
</head>

<body class="bg-brand-dark text-brand-light dark:text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div class="pb-20" id="header-placeholder"></div>

            <main class="pt-32 pb-20 px-4">
                <div class="max-w-7xl mx-auto">
                    <div class="max-w-md mx-auto bg-brand-dark border border-white/10 rounded-2xl p-8 text-center">
                        <h1 class="text-2xl font-bold mb-2">Meu número da sorte</h1>
                        <p id="mn-sub" class="text-sm text-gray-400 mb-6">Consultando...</p>

                        <div id="mn-tem" class="hidden">
                            <div id="mn-numero" class="text-5xl font-bold tracking-widest text-emerald-400 mb-4">----
                            </div>
                            <div id="mn-detalhes" class="text-sm text-gray-400 whitespace-pre-line mb-6"></div>
                            <a href="./jogos.html"
                                class="block w-full font-semibold text-sm rounded-lg py-3 bg-green-600 text-white hover:bg-green-700 transition mb-3">
                                Jogar novamente
                            </a>
                            <a href="https://microgateinformatica.com.br" target="_blank" rel="noopener"
                                class="block w-full font-semibold text-sm rounded-lg py-3 border border-white/10 text-white hover:bg-white/5 transition">
                                Acessar Website
                            </a>
                        </div>

                        <div id="mn-sem" class="hidden">
                            <p class="text-sm text-gray-400 mb-6">Você ainda não participou do sorteio. Jogue um
                                minigame para gerar seu número da sorte.</p>
                            <a href="./jogos.html"
                                class="block w-full font-semibold text-sm rounded-lg py-3 bg-green-600 text-white hover:bg-green-700 transition">
                                Ir para os jogos
                            </a>
                        </div>

                        <div id="mn-erro" class="hidden text-sm text-red-400"></div>
                    </div>
                </div>
            </main>

            <footer id="footer-placeholder" class="py-16 bg-brand-dark text-gray-400 border-t border-white/10"></footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = SorteioAPI.getParticipante();
            if (!token) {
                window.location.href = './index.html';
                return;
            }

            const sub = document.getElementById('mn-sub');
            const tem = document.getElementById('mn-tem');
            const sem = document.getElementById('mn-sem');
            const erroEl = document.getElementById('mn-erro');

            SorteioAPI.consultarNumero(token)
                .then((dados) => {
                    sub.classList.add('hidden');
                    if (dados.tem_numero) {
                        document.getElementById('mn-numero').textContent = dados.numero_sorte;

                        const linhas = [];
                        if (dados.nome) linhas.push(dados.nome);
                        if (dados.empresa) linhas.push(dados.empresa);
                        const nomeJogo = dados.jogo === 'firewall_defense'
                            ? 'Firewall Defense'
                            : (dados.jogo === 'patch_panel_rush' ? 'Patch Panel Rush' : dados.jogo);
                        linhas.push(`Jogo: ${nomeJogo} · Pontuação: ${dados.pontuacao ?? 0}`);
                        if (dados.gerado_em) {
                            linhas.push(`Gerado em: ${new Date(dados.gerado_em).toLocaleString('pt-BR')}`);
                        }
                        document.getElementById('mn-detalhes').textContent = linhas.join('\n');

                        tem.classList.remove('hidden');
                    } else {
                        sem.classList.remove('hidden');
                    }
                })
                .catch((err) => {
                    sub.classList.add('hidden');
                    erroEl.textContent = err.message;
                    erroEl.classList.remove('hidden');
                });
        });
    </script>
</body>

</html>

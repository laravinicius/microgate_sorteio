<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha seu jogo | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/jogos.css">
    <script src="https://unpkg.com/lucide@1.29.0/dist/umd/lucide.min.js" integrity="sha384-wyD7qHuL36bnPiQFkqRuq46WXCrlyGbI5w/mvqgTcJ/NwMFSXCr1f+DpJoCqeLRY" crossorigin="anonymous"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>
    <script src="./js/sorteio-api.js" defer></script>

</head>

<body class="bg-brand-dark text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div class="pb-6" id="header-placeholder"></div>

            <main class="pb-20 px-4 sm:px-6">
                <div class="max-w-3xl mx-auto text-center">
                    <div class="inline-flex items-center gap-2 text-[10px] uppercase tracking-widest text-[#ffb020] font-semibold mb-3">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#ffb020]"></span>
                        Modo Minigame
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold mb-2">Escolha seu minigame</h1>
                    <p class="text-sm text-gray-400 mb-8">Você tem até 2 minutos. Ao concluir, seu número da sorte é
                        gerado na hora.</p>

                    <div id="mensagem-bloqueio" class="hidden mb-6 text-sm text-amber-400"></div>

                    <div class="grid sm:grid-cols-2 gap-4 sm:gap-6">
                        <button data-jogo="firewall_defense"
                            class="card-jogo rounded-2xl p-5 sm:p-6 text-left">
                            <span class="badge-jogo text-red-400 border border-red-500/30 bg-red-500/10">
                                <i data-lucide="shield" class="w-3.5 h-3.5"></i> Bloqueio
                            </span>
                            <h2 class="text-lg font-semibold mb-1.5">🛡️ Firewall Defense</h2>
                            <p class="desc">Bloqueie o tráfego malicioso antes que ele chegue ao datacenter.</p>
                            <div class="meta-status">
                                <span class="w-1.5 h-1.5 rounded-full bg-[#3ddc84] animate-pulse"></span>
                                <span>Duração: 60 segundos</span>
                            </div>
                        </button>

                        <button data-jogo="patch_panel_rush"
                            class="card-jogo rounded-2xl p-5 sm:p-6 text-left">
                            <span class="badge-jogo text-blue-400 border border-blue-500/30 bg-blue-500/10">
                                <i data-lucide="cable" class="w-3.5 h-3.5"></i> Cabeamento
                            </span>
                            <h2 class="text-lg font-semibold mb-1.5">🔌 Patch Panel Rush</h2>
                            <p class="desc">Conecte os cabos certos no patch panel o mais rápido possível.</p>
                            <div class="meta-status">
                                <span class="w-1.5 h-1.5 rounded-full bg-[#5cc0ff] animate-pulse"></span>
                                <span>3 rodadas · tempo crescente</span>
                            </div>
                        </button>
                    </div>
                </div>
            </main>

            <footer id="footer-placeholder" class="footer-tech"></footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const participanteToken = SorteioAPI.getParticipante();
            const mensagemBloqueio = document.getElementById('mensagem-bloqueio');
            const botoes = document.querySelectorAll('.card-jogo');

            if (!participanteToken) {
                window.location.href = './index.html';
                return;
            }

            // Aviso informativo: quem já tem número pode jogar de novo, mas sem gerar novo número
            SorteioAPI.consultarNumero(participanteToken)
                .then((dados) => {
                    if (dados.tem_numero) {
                        mensagemBloqueio.textContent =
                            `Você já tem o número ${dados.numero_sorte}. Pode jogar novamente, mas nenhum novo número será gerado.`;
                        mensagemBloqueio.classList.remove('hidden');
                    }
                })
                .catch(() => {});

            const destinos = {
                firewall_defense: './fdefense.html',
                patch_panel_rush: './pprush.html',
            };

            botoes.forEach((botao) => {
                botao.addEventListener('click', async () => {
                    botoes.forEach((b) => (b.disabled = true));
                    try {
                        const jogo = botao.dataset.jogo;
                        const resultado = await SorteioAPI.iniciarJogo(participanteToken, jogo);
                        SorteioAPI.salvarSessaoJogo(resultado.sessao_token, jogo);
                        window.location.href = destinos[jogo];
                    } catch (err) {
                        mensagemBloqueio.textContent = err.message;
                        mensagemBloqueio.classList.remove('hidden');
                        botoes.forEach((b) => (b.disabled = false));
                    }
                });
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://unpkg.com/lucide@1.29.0/dist/umd/lucide.min.js" integrity="sha384-wyD7qHuL36bnPiQFkqRuq46WXCrlyGbI5w/mvqgTcJ/NwMFSXCr1f+DpJoCqeLRY" crossorigin="anonymous"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>
    <script src="./js/sorteio-api.js" defer></script>
    <script src="./js/google-config.js" defer></script>
    <script src="./js/google-auth.js" defer></script>
</head>

<body class="bg-brand-dark text-brand-light dark:text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div class="pb-6" id="header-placeholder"></div>

            <main class="pb-20 px-4 sm:px-6">
                <div class="max-w-7xl mx-auto">
                    <div class="max-w-md mx-auto bg-brand-dark border border-white/10 rounded-2xl p-6 sm:p-8">
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center gap-2 text-[10px] uppercase tracking-widest text-[#ffb020] font-semibold mb-3">
                                <span class="w-1.5 h-1.5 rounded-full bg-[#ffb020]"></span>
                                Sorteio Microgate
                            </div>
                            <h1 class="text-2xl font-bold mb-2">Participe do Sorteio</h1>
                            <p class="text-sm text-gray-400">
                                Jogue um minigame rápido (até 2 min) e receba seu número da sorte.
                            </p>
                        </div>

                        <div id="google-button" class="w-full flex justify-center mb-4"></div>
                        <div id="google-mensagem" class="text-sm text-red-400 text-center hidden"></div>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-white/10"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-4 bg-brand-dark text-gray-500 text-xs uppercase tracking-wider">ou</span>
                            </div>
                        </div>

                        <div id="email-login" class="space-y-4">
                            <div>
                                <label for="email-login-input" class="block text-sm mb-1.5 text-gray-300">E-mail</label>
                                <input id="email-login-input" type="email" autocomplete="email" placeholder="seu@email.com"
                                    class="input-tech">
                            </div>
                            <button type="button" id="btn-enviar-codigo"
                                class="btn-tech btn-tech-primary btn-tech-full">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                                Enviar código por e-mail
                            </button>
                            <div id="email-mensagem" class="text-sm text-red-400 text-center hidden"></div>
                        </div>

                        <p class="text-xs text-gray-500 text-center mt-6 leading-relaxed">
                            Ao participar, você declara ter lido e concordado com a
                            <a href="./privacidade.html" class="underline hover:text-white transition">Política de
                                Privacidade</a>.
                        </p>
                    </div>
                </div>
            </main>

            <footer id="footer-placeholder" class="footer-tech"></footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnEnviar = document.getElementById('btn-enviar-codigo');
            const emailInput = document.getElementById('email-login-input');
            const msg = document.getElementById('email-mensagem');
            const googleMsg = document.getElementById('google-mensagem');

            btnEnviar.addEventListener('click', async () => {
                const email = emailInput.value.trim().toLowerCase();
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    msg.textContent = 'Informe um e-mail válido.';
                    msg.classList.remove('hidden');
                    return;
                }
                btnEnviar.disabled = true;
                btnEnviar.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Enviando...';
                if (window.lucide) window.lucide.createIcons();
                msg.classList.add('hidden');
                googleMsg.classList.add('hidden');

                try {
                    await SorteioAPI.enviarCodigo(email);
                    window.location.href = `./verificar-codigo.html?email=${encodeURIComponent(email)}`;
                } catch (err) {
                    msg.textContent = err.message;
                    msg.classList.remove('hidden');
                    btnEnviar.disabled = false;
                    btnEnviar.innerHTML = '<i data-lucide="mail" class="w-4 h-4"></i> Enviar código por e-mail';
                    if (window.lucide) window.lucide.createIcons();
                }
            });
        });
    </script>
</body>

</html>

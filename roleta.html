<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta do Sorteio | Microgate Informática</title>
    <link rel="shortcut icon" href="./img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/roleta.css">
    <script src="https://unpkg.com/lucide@1.29.0/dist/umd/lucide.min.js" integrity="sha384-wyD7qHuL36bnPiQFkqRuq46WXCrlyGbI5w/mvqgTcJ/NwMFSXCr1f+DpJoCqeLRY" crossorigin="anonymous"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/components.js" defer></script>
    <script src="./js/sorteio-api.js" defer></script>
</head>

<body class="bg-brand-dark text-brand-light dark:text-brand-light">
    <div class="boxed-layout">
        <div class="content-wrapper min-h-screen">
            <div class="pb-6" id="header-placeholder"></div>

            <main class="pb-20 px-4 sm:px-6">
                <div class="max-w-xl mx-auto">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold mb-2">Sorteio ao Vivo</h1>
                        <p id="roleta-sub" class="text-sm text-gray-400">Carregando participantes...</p>
                    </div>

                    <div id="roleta-carregando" class="text-sm text-gray-400 py-8 text-center">Carregando...</div>
                    <div id="roleta-erro" class="hidden text-sm text-red-400 py-8 text-center"></div>
                    <div id="roleta-sem-numeros" class="hidden text-sm text-gray-400 py-8 text-center">Nenhum participante com número da sorte.</div>

                    <div id="roleta-area" class="hidden">
                        <div class="flex flex-col items-center gap-8">
                            <div id="roleta-card-container" class="roleta-card-container">
                                <div id="roleta-card" class="roleta-card">
                                    <div class="roleta-card-face roleta-card-face--frente">
                                        <div id="roleta-numero-frente" class="roleta-numero">000000</div>
                                    </div>
                                    <div class="roleta-card-face roleta-card-face--verso">
                                        <div id="roleta-numero-verso" class="roleta-numero">000000</div>
                                    </div>
                                </div>
                            </div>

                            <button id="roleta-btn" class="btn-tech btn-tech-primary btn-tech-full" style="max-width: 280px;">
                                <i data-lucide="play" class="w-4 h-4"></i>
                                Girar
                            </button>

                            <div id="roleta-resultado" class="hidden roleta-resultado w-full">
                                <div class="grid gap-4">
                                    <div>
                                        <div class="roleta-resultado-label">Número da Sorte</div>
                                        <div id="res-numero" class="roleta-resultado-valor roleta-resultado-valor--numero"></div>
                                    </div>
                                    <div>
                                        <div class="roleta-resultado-label">Nome</div>
                                        <div id="res-nome" class="roleta-resultado-valor roleta-resultado-valor--nome"></div>
                                    </div>
                                    <div>
                                        <div class="roleta-resultado-label">E-mail</div>
                                        <div id="res-email" class="roleta-resultado-valor"></div>
                                    </div>
                                    <div>
                                        <div class="roleta-resultado-label">Celular</div>
                                        <div id="res-celular" class="roleta-resultado-valor"></div>
                                    </div>
                                </div>
                            </div>

                            <button id="roleta-btn-reset" class="btn-tech btn-tech-secondary hidden" style="max-width: 280px;">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                Girar novamente
                            </button>
                        </div>
                    </div>
                </div>
            </main>

            <footer id="footer-placeholder" class="footer-tech"></footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = SorteioAPI.getParticipante();
            if (!token) {
                window.location.href = './index.html';
                return;
            }

            const carregando = document.getElementById('roleta-carregando');
            const erroEl = document.getElementById('roleta-erro');
            const semNumeros = document.getElementById('roleta-sem-numeros');
            const area = document.getElementById('roleta-area');
            const sub = document.getElementById('roleta-sub');
            const btn = document.getElementById('roleta-btn');
            const btnReset = document.getElementById('roleta-btn-reset');
            const card = document.getElementById('roleta-card');
            const numFrente = document.getElementById('roleta-numero-frente');
            const numVerso = document.getElementById('roleta-numero-verso');
            const resultado = document.getElementById('roleta-resultado');
            const resNumero = document.getElementById('res-numero');
            const resNome = document.getElementById('res-nome');
            const resEmail = document.getElementById('res-email');
            const resCelular = document.getElementById('res-celular');

            let participantes = [];
            let girando = false;
            let animFrame = null;

            function mascararEmail(email) {
                if (!email) return '—';
                const arroba = email.indexOf('@');
                if (arroba <= 1) return email;
                return email[0] + '***' + email.slice(arroba);
            }

            function mascararCelular(cel) {
                if (!cel) return '—';
                const nums = cel.replace(/\D/g, '');
                if (nums.length < 4) return cel;
                return nums.slice(0, 2) + '****' + nums.slice(-2);
            }

            function shuffle(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function setNumero(text) {
                numFrente.textContent = text;
                numVerso.textContent = text;
            }

            function girar() {
                if (girando || participantes.length === 0) return;
                girando = true;
                btn.classList.add('hidden');
                resultado.classList.add('hidden');
                btnReset.classList.add('hidden');
                card.classList.remove('parado');
                card.classList.add('girando');
                card.classList.remove('roleta-glow-vencedor');
                card.classList.add('roleta-glow');

                const ordem = shuffle(participantes);
                const idxVencedor = Math.floor(Math.random() * ordem.length);
                const DURACAO_SPIN = 10000;
                const tempoInicio = performance.now();
                let face = 0;
                let idx = 0;
                let intervalo = 40;
                let ultimoTick = 0;

                function tick(ts) {
                    if (ts - ultimoTick < intervalo) {
                        animFrame = requestAnimationFrame(tick);
                        return;
                    }
                    ultimoTick = ts;

                    const p = ordem[idx % ordem.length];
                    setNumero(p.numero);
                    face = 1 - face;
                    card.style.transform = `rotateY(${face * 180}deg)`;

                    idx++;

                    if (performance.now() - tempoInicio < DURACAO_SPIN) {
                        intervalo = Math.min(40 + idx * 2, 200);
                        animFrame = requestAnimationFrame(tick);
                    } else {
                        const vencedor = ordem[idxVencedor];
                        setNumero(vencedor.numero);
                        card.classList.remove('girando');
                        card.classList.add('parado');
                        card.style.transform = `rotateY(0deg)`;
                        card.classList.remove('roleta-glow');
                        card.classList.add('roleta-glow-vencedor');

                        resNumero.textContent = vencedor.numero;
                        resNome.textContent = vencedor.nome_completo;
                        resEmail.textContent = mascararEmail(vencedor.email);
                        resCelular.textContent = mascararCelular(vencedor.celular);

                        setTimeout(() => {
                            resultado.classList.remove('hidden');
                            btnReset.classList.remove('hidden');
                            if (window.lucide) window.lucide.createIcons();
                            girando = false;
                        }, 600);
                    }
                }

                animFrame = requestAnimationFrame(tick);
            }

            function resetar() {
                resultado.classList.add('hidden');
                btnReset.classList.add('hidden');
                btn.classList.remove('hidden');
                setNumero('000000');
                card.classList.remove('parado', 'roleta-glow-vencedor');
                card.classList.add('roleta-glow');
                card.style.transform = 'rotateY(0deg)';
            }

            btn.addEventListener('click', girar);
            btnReset.addEventListener('click', resetar);

            SorteioAPI.listarNumerosSorte(token)
                .then((dados) => {
                    participantes = dados.participantes || [];
                    sub.textContent = `${participantes.length} participante(s) com número da sorte.`;
                    carregando.classList.add('hidden');
                    if (participantes.length === 0) {
                        semNumeros.classList.remove('hidden');
                        return;
                    }
                    area.classList.remove('hidden');
                    card.classList.add('roleta-glow');
                    if (window.lucide) window.lucide.createIcons();
                })
                .catch((err) => {
                    carregando.classList.add('hidden');
                    erroEl.textContent = err.message;
                    erroEl.classList.remove('hidden');
                    if (err.status === 403 || err.status === 404) {
                        setTimeout(() => { window.location.href = './perfil.html'; }, 2000);
                    }
                });
        });
    </script>
</body>

</html>
